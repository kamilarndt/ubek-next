services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ubek_next
      POSTGRES_USER: ubek
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubek"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      AGENT_API_KEY: ${AGENT_API_KEY}
      ROUTER_URL: ${ROUTER_URL}
      ROUTER_API_KEY: ${ROUTER_API_KEY}
      MODEL: ${MODEL}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  next:
    build:
      context: ./next
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AGENT_API_KEY: ${AGENT_API_KEY}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ubek_next
      PGUSER: ubek
      PGPASSWORD: ${PGPASSWORD}
      ROUTER_URL: ${ROUTER_URL}
      ROUTER_API_KEY: ${ROUTER_API_KEY}
      MODEL: ${MODEL}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
