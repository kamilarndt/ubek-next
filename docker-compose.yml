services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ubek_next
      POSTGRES_USER: ubek
      POSTGRES_PASSWORD: ubek
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubek"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-ac42f4e7a4ee1071eaa1dcf7764dbec57a126453c73d3721fe36440b78c93517}
      AGENT_API_KEY: ${AGENT_API_KEY:-6d3f05459f3f2798ca39affe109f5e20d0b431fe67b726c041cf2dde6c0d37fe}
      ROUTER_URL: ${ROUTER_URL:-http://host.docker.internal:18881/v1}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-sk-rtr-9a293008-edad-4566-a3d8-925f4dcbd4a5}
      MODEL: ${MODEL:-default}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  next:
    build:
      context: ./next
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ac42f4e7a4ee1071eaa1dcf7764dbec57a126453c73d3721fe36440b78c93517}
      AGENT_API_KEY: ${AGENT_API_KEY:-6d3f05459f3f2798ca39affe109f5e20d0b431fe67b726c041cf2dde6c0d37fe}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ubek_next
      PGUSER: ubek
      PGPASSWORD: ubek
      ROUTER_URL: ${ROUTER_URL:-http://host.docker.internal:18881/v1}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-sk-rtr-9a293008-edad-4566-a3d8-925f4dcbd4a5}
      MODEL: ${MODEL:-default}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
