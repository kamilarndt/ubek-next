name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ubek_next_test
          POSTGRES_USER: ubek
          POSTGRES_PASSWORD: ubek
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            agent/package-lock.json
            next/package-lock.json

      - name: Agent tests
        working-directory: agent
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Next.js tests
        working-directory: next
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
